<html lang="en"
      xmlns:customary="https://customaryjs.github.io/schema"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="https://customaryjs.github.io/schema https://customaryjs.github.io/customary.xsd"
>
<title>Logic ~ for-within-for ~ Customary Cookbook</title>

<h1>Customary Logic Tags</h1>

<p>~ for-within-for ~</p><br/>

<script type="application/json"
    data-customary-name="logic-for-within-for-recipe"
    data-customary-value="groups"
>
  [
    {
      "name": "Fruits",
      "categories": [
        {"name": "Citrus",  "items": ["Orange", "Lemon", "Lime"]},
        {"name": "Berries", "items": ["Strawberry", "Blueberry", "Raspberry"]}
      ]
    },
    {
      "name": "Vegetables",
      "categories": [
        {"name": "Root",  "items": ["Carrot", "Potato", "Beet"]},
        {"name": "Leafy", "items": ["Spinach", "Kale", "Arugula"]}
      ]
    }
  ]
</script>

<logic-for-within-for-recipe></logic-for-within-for-recipe>

<template data-customary-name="logic-for-within-for-recipe">
  <customary:for items="{{groups}}" value="group">
    <h2>{[group.name]}</h2>
    <div style="display: flex; gap: 2em">
      <customary:for items="{[group.categories]}" value="category">
        <div>
          <h3>{[category.name]}</h3>
          <ul>
            <customary:for items="{[category.items]}" value="item">
              <li>{[item]}</li>
            </customary:for>
        </ul>
        </div>
      </customary:for>
    </div>
  </customary:for>
</template>

<script type="importmap">{"imports": {
  "#customary": "../../_dependencies/customary/customary.mjs",
  "#customary/lit": "../../_dependencies/customary/customary-lit-dev.mjs"
}}</script>
<script type="module">import '#customary';</script>
</html>
