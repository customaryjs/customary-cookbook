<title>Attributes ~ declared at template ~ Customary Cookbook</title>

<h1>Customary Attributes</h1>

<p>~ declared at template ~</p><br/>

<attributes-template
        term="attribute"
        definition="A named value declared on an HTML tag."
></attributes-template>
<attributes-template
        term="template"
        definition="Inert HTML, ready to be stamped."
></attributes-template>
<attributes-template
        term="interpolation"
        definition="Text where a value takes its place."
></attributes-template>

<template
        data-customary-name="attributes-template"
        data-customary-attributes="term,definition"
>
    <h1>{{term}}</h1>
    <p>{{definition}}</p>
</template>

<script type="importmap">{"imports": {
    "#customary": "../../_dependencies/customary/customary.mjs",
    "#customary/lit": "../../_dependencies/customary/customary-lit-dev.mjs"
}}</script>
<script type="module">import '#customary';</script>
