<p>Clicks: <span class="tally">{{count}}</span></p>

<ul>
    <li>
        <button class="count">Count</button>
        <code>el =&gt; el.count = el.count + 1</code>
        <span>a property of <code>el</code>, without typecast</span>
    </li>
    <li>
        <button class="reset">Reset</button>
        <code>el =&gt; el.reset()</code>
        <span>a method of <code>el</code>, without typecast,
            without passing <code>el</code>: it uses <code>this</code></span>
    </li>
    <li>
        <button class="describe">Describe</button>
        <code>(el: EventsComponent, event: Event, target: EventTarget)</code>
        <span>the arguments typified, if so desired</span>
    </li>
</ul>

<p class="description">{{description}}</p>
